[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kendo-tournament"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "PySide6",
  "python-docx",
  "pdfplumber",
  "olefile",
  "reportlab",
]

[project.optional-dependencies]
dev = ["pytest", "pyinstaller", "ruff"]

[project.gui-scripts]
kendo-tournament = "kendo_tournament.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE"]
# 줄 길이는 ruff format 이 맞춘다. 한글 안내 문장은 쪼개면 읽기 어려워 길이 검사에서 뺀다.
ignore = ["E501"]
